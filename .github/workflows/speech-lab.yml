name: speech-lab

# SpeechLab: measure Apple speech recognition on spoken chess moves (see Tools/SpeechLab/README.md).
# corpus-linux builds Piper + real-human audio; recognize (4 macOS shards) adds macOS `say` voices, applies the
# acoustic environments and runs every recognizer config; publish merges the shards into a draft release asset.

on:
  push:
    branches: [claude/exciting-edison-oxy0hj]
    paths:
      - 'Tools/SpeechLab/**'
      - '!Tools/SpeechLab/**.md'
      - '!Tools/SpeechLab/analyze.py'
      - '.github/workflows/speech-lab.yml'
  workflow_dispatch:

permissions:
  contents: read

env:
  SHARDS: 4

jobs:
  probe-mac:
    runs-on: macos-26
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - name: Info
        run: |
          sw_vers; sysctl -n machdep.cpu.brand_string hw.ncpu hw.memsize; xcodebuild -version
          xcrun simctl list runtimes
          say -v '?' | grep -E ' en_' | awk '{print}' | head -80
          SDK=$(xcrun --show-sdk-path)
          grep -nE 'customizedLanguage|static func reserve|reservedLocales|bestAvailableAudioFormat' $SDK/System/Library/Frameworks/Speech.framework/Modules/Speech.swiftmodule/arm64e-apple-macos.swiftinterface | head -20
      - name: Build (macOS + iOS simulator)
        run: |
          Tools/SpeechLab/recognizer/build.sh $PWD/build macos
          Tools/SpeechLab/recognizer/build.sh $PWD/build-sim iossim || echo "SIM BUILD FAILED"
      - name: Clips + TCC
        run: |
          say -v Samantha -o /tmp/t1.wav --data-format=LEI16@16000 "knight to f3"
          say -v Daniel -o /tmp/t2.wav --data-format=LEI16@16000 "h8"
          python3 Tools/SpeechLab/scripts/tcc_grant.py kTCCServiceSpeechRecognition $PWD/build/speechlab com.blindchess.speechlab /bin/bash /opt/hca/hosted-compute-agent
      - name: Siri / Dictation state
        run: |
          for d in com.apple.assistant.support com.apple.Siri com.apple.HIToolbox com.apple.speech.recognition.AppleSpeakableItems com.apple.SpeechRecognitionCore; do echo "== $d"; defaults read $d 2>&1 | head -20; done
          sudo profiles list 2>&1 | head; ls /Library/Managed\ Preferences 2>&1 | head
          defaults read /Library/Preferences/com.apple.assistant.support 2>&1 | head
          pgrep -lf -i 'speech|assistant|dictation' | head -20
      - name: Enable Siri + Dictation and probe again
        run: |
          Tools/SpeechLab/scripts/enable_dictation.sh
          perl -e 'alarm 200; exec @ARGV' build/speechlab probe /tmp/t2.wav 2>&1 | grep -vE 'Created directory' || true
          perl -e 'alarm 200; exec @ARGV' build/speechlab probe /tmp/t1.wav 2>&1 | grep -E 'PROBE' || true
      - name: iOS simulator attempt
        run: |
          [ -x build-sim/speechlab ] || { echo "no sim build"; exit 0; }
          UDID=$(xcrun simctl list devices available -j | python3 -c "import json,sys; d=json.load(sys.stdin)['devices']; print([x['udid'] for k,v in d.items() if 'iOS' in k for x in v if 'iPhone' in x['name']][-1])")
          echo "sim $UDID"; xcrun simctl boot $UDID; xcrun simctl bootstatus $UDID -b | tail -1
          DB=~/Library/Developer/CoreSimulator/Devices/$UDID/data/Library/TCC/TCC.db; ls -l "$DB" || true
          sqlite3 "$DB" .schema 2>&1 | head -3
          python3 - "$DB" "$PWD/build-sim/speechlab" <<'PY2'
          import sqlite3, sys, time
          db, exe = sys.argv[1], sys.argv[2]
          con = sqlite3.connect(db); cols = [r[1] for r in con.execute("PRAGMA table_info(access)")]
          print(cols)
          for c, t in [(exe, 1), ("com.blindchess.speechlab", 0)]:
              v = {"service": "kTCCServiceSpeechRecognition", "client": c, "client_type": t, "auth_value": 2, "auth_reason": 4, "auth_version": 1, "flags": 0, "last_modified": int(time.time()), "indirect_object_identifier": "UNUSED", "indirect_object_identifier_type": 0, "boot_uuid": "UNUSED", "last_reminded": int(time.time())}
              con.execute(f"INSERT OR REPLACE INTO access ({','.join(cols)}) VALUES ({','.join('?'*len(cols))})", [v.get(k) for k in cols])
          con.commit(); print("sim tcc ok")
          PY2
          perl -e 'alarm 240; exec @ARGV' xcrun simctl spawn $UDID $PWD/build-sim/speechlab probe /tmp/t2.wav 2>&1 | grep -vE 'Created directory' | head -40 || true

  corpus-linux:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - name: Tools
        run: pip install -q piper-tts numpy scipy soundfile audiotsm
      - name: Download models + datasets
        run: |
          mkdir -p dl/models dl/demand && cd dl
          B=https://huggingface.co/rhasspy/piper-voices/resolve/main/en
          for m in en_US/libritts_r/medium/en_US-libritts_r-medium en_GB/vctk/medium/en_GB-vctk-medium \
                   en_US/arctic/medium/en_US-arctic-medium en_US/l2arctic/medium/en_US-l2arctic-medium \
                   en_GB/alba/medium/en_GB-alba-medium en_GB/northern_english_male/medium/en_GB-northern_english_male-medium \
                   en_US/ryan/high/en_US-ryan-high; do
            (cd models && curl -sfL -O $B/$m.onnx -O $B/$m.onnx.json || echo "MISSING $m") &
          done
          (curl -sfL https://dldata-public.s3.us-east-2.amazonaws.com/an4_sphere.tar.gz | tar xz && echo AN4 ok || echo "AN4 FAILED") &
          (git clone -q --depth 1 https://github.com/Jakobovski/free-spoken-digit-dataset fsdd && echo FSDD ok) &
          (mkdir -p sc && curl -sfL http://download.tensorflow.org/data/speech_commands_v0.02.tar.gz | tar xz -C sc --wildcards '*one/*' '*two/*' '*three/*' '*four/*' '*five/*' '*six/*' '*seven/*' '*eight/*' 2>/dev/null; echo "SC $(ls sc | wc -l) dirs") &
          for z in PCAFETER STRAFFIC DLIVING; do
            (curl -sfL -o demand/$z.zip https://zenodo.org/records/1227121/files/${z}_16k.zip && unzip -q -o demand/$z.zip "$z/ch01.wav" -d demand && echo "DEMAND $z ok") &
          done
          wait
          ls models; du -sh *
      - name: Build corpus
        run: |
          C=Tools/SpeechLab/corpus; mkdir -p out/audio
          python3 $C/phrases.py > out/phrases.jsonl
          python3 $C/make_noise.py --demand dl/demand --models dl/models --out out/noise
          python3 $C/make_human.py --phrases out/phrases.jsonl --an4 dl/an4 --fsdd dl/fsdd --sc dl/sc --out out/audio --manifest out/human_clean.jsonl
          python3 $C/make_piper.py --phrases out/phrases.jsonl --models dl/models --out out/audio --manifest out/piper_clean.jsonl
          cat out/human_clean.jsonl out/piper_clean.jsonl > out/clean.jsonl
          python3 $C/augment.py --in out/clean.jsonl --root out/audio --noise out/noise --out out/manifest_linux.jsonl --per-clip 1
          wc -l out/*.jsonl; du -sh out/audio out/noise
      - uses: actions/upload-artifact@v4
        with:
          name: corpus-linux
          path: out
          retention-days: 7
          compression-level: 1

  recognize:
    needs: corpus-linux
    runs-on: macos-26
    timeout-minutes: 85
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - name: Build recognizer
        run: Tools/SpeechLab/recognizer/build.sh $PWD/build macos
      - name: Authorize speech recognition (TCC) + enable Siri/Dictation
        run: |
          python3 Tools/SpeechLab/scripts/tcc_grant.py kTCCServiceSpeechRecognition $PWD/build/speechlab com.blindchess.speechlab /bin/bash /opt/hca/hosted-compute-agent
          Tools/SpeechLab/scripts/enable_dictation.sh
      - uses: actions/download-artifact@v4
        with:
          name: corpus-linux
          path: out
      - name: macOS say voices + environments
        run: |
          python3 -m venv /tmp/venv && /tmp/venv/bin/pip install -q numpy scipy soundfile audiotsm
          C=Tools/SpeechLab/corpus
          /tmp/venv/bin/python $C/make_say.py --phrases out/phrases.jsonl --out out/audio --manifest out/say_clean.jsonl --shard ${{ matrix.shard }} --shards $SHARDS
          /tmp/venv/bin/python $C/augment.py --in out/say_clean.jsonl --root out/audio --noise out/noise --out out/say_manifest.jsonl --per-clip 1 | tail -2
          /tmp/venv/bin/python Tools/SpeechLab/scripts/shard.py --shard ${{ matrix.shard }} --shards $SHARDS out/manifest_linux.jsonl out/say_manifest.jsonl > out/my.jsonl
          wc -l out/my.jsonl
      - name: Recognize
        run: |
          mkdir -p res
          perl -e 'alarm 4200; exec @ARGV' build/speechlab run --manifest out/my.jsonl --root out/audio --out res/results-${{ matrix.shard }}.jsonl \
            --configs dict,dict_ctx,dict_lm,ondevice,ondevice_ctx,ondevice_lm,server,server_ctx,st \
            --filter "server=every:3;server_ctx=every:3" --budget 3300 2> res/log-${{ matrix.shard }}.txt || echo "exit=$?"
          grep -E 'disabling|custom LM|assets|reserve|budget|done rows' res/log-${{ matrix.shard }}.txt; tail -3 res/log-${{ matrix.shard }}.txt
          wc -l res/*.jsonl
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: results-${{ matrix.shard }}
          path: res
          retention-days: 7

  publish:
    needs: recognize
    if: always()
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          pattern: results-*
          path: res
          merge-multiple: true
      - name: Merge + attach to a draft release (fetched by the SpeechLab maintainer, then deleted)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ls -la res; cat res/results-*.jsonl > results.jsonl; wc -l results.jsonl
          tar czf speechlab-results.tgz results.jsonl res/log-*.txt
          gh release create "speechlab-${{ github.run_id }}" --repo ${{ github.repository }} --draft \
            --title "SpeechLab results ${{ github.run_id }}" --notes "Raw Apple recognizer transcripts (draft, temporary)." speechlab-results.tgz
